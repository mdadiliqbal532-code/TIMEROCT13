name: Build DeenTimeR Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Assemble Native Android Project & Embed index.html
        run: |
          mkdir -p android_build/app/src/main/assets
          mkdir -p android_build/app/src/main/java/com/example/deentimer
          mkdir -p android_build/app/src/main/res/layout
          mkdir -p android_build/app/src/main/res/drawable
          mkdir -p android_build/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android_build/app/src/main/res/values

          # Copy index.html from repo root (or existing assets folder) into Android assets
          if [ -f "index.html" ]; then
            cp index.html android_build/app/src/main/assets/index.html
          elif [ -f "app/src/main/assets/index.html" ]; then
            cp app/src/main/assets/index.html android_build/app/src/main/assets/index.html
          fi

          # 1. settings.gradle
          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DeenTimeR"
          include ':app'
          EOF

          # 2. gradle.properties
          cat << 'EOF' > android_build/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 4. App build.gradle
          cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.deentimer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.deentimer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.activity:activity-ktx:1.8.2'
          }
          EOF

          # 5. AndroidManifest.xml (All Permissions Allowed + Always Screen On Support)
          cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="DeenTimeR"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:exported="true"
                      android:keepScreenOn="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. activity_main.xml
          cat << 'EOF' > android_build/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/main"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#020617"
              android:keepScreenOn="true">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#020617"
                  android:keepScreenOn="true" />
          </FrameLayout>
          EOF

          # 7. Adaptive Pro Launcher Icon XMLs
          cat << 'EOF' > android_build/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#020617" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1E293B" android:pathData="M54,56m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0"/>
              <path android:fillColor="#00000000" android:strokeColor="#3B82F6" android:strokeWidth="5.5" android:strokeLineCap="round" android:pathData="M54,32 A24,24 0 1,1 32,66"/>
              <path android:fillColor="#00000000" android:strokeColor="#10B981" android:strokeWidth="3" android:strokeLineCap="round" android:pathData="M54,39 A17,17 0 1,1 39,63"/>
              <path android:fillColor="#FF4757" android:pathData="M54,43 C54,43 62,50 60,58 C59,63 54,66 54,66 C54,66 49,63 48,58 C46,50 54,43 54,43 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,56m-3,0a3,3 0,1 1,6 0a3,3 0,1 1,-6 0"/>
          </vector>
          EOF

          cat << 'EOF' > android_build/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 8. MainActivity.kt (Crash-proof, Redmi/MIUI Safe, Firebase HTTPS BaseURL)
          cat << 'EOF' > android_build/app/src/main/java/com/example/deentimer/MainActivity.kt
          package com.example.deentimer

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.GeolocationPermissions
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Color.parseColor("#020617")
                  window.navigationBarColor = Color.parseColor("#020617")

                  WindowCompat.getInsetsController(window, window.decorView).apply {
                      isAppearanceLightStatusBars = false
                      isAppearanceLightNavigationBars = false
                  }

                  setContentView(R.layout.activity_main)
                  webView = findViewById(R.id.webview)
                  webView.keepScreenOn = true

                  requestAllPermissions()

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      setGeolocationEnabled(true)
                      allowFileAccess = true
                      allowContentAccess = true
                      allowFileAccessFromFileURLs = true
                      allowUniversalAccessFromFileURLs = true
                      javaScriptCanOpenWindowsAutomatically = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onGeolocationPermissionsShowPrompt(origin: String?, callback: GeolocationPermissions.Callback?) {
                          callback?.invoke(origin, true, false)
                      }
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          request?.let { runOnUiThread { it.grant(it.resources) } }
                      }
                  }

                  webView.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun setKeepScreenOn(enable: Boolean) {
                          runOnUiThread {
                              if (enable) {
                                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                  webView.keepScreenOn = true
                              } else {
                                  window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                  webView.keepScreenOn = false
                              }
                          }
                      }
                  }, "AndroidBridge")

                  val htmlContent = assets.open("index.html").bufferedReader().use { it.readText() }
                  webView.loadDataWithBaseURL(
                      "https://neettimercloud.firebaseapp.com/",
                      htmlContent,
                      "text/html",
                      "UTF-8",
                      null
                  )

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript("window.handleAndroidBack && window.handleAndroidBack()") { result ->
                              if (result != "true") {
                                  moveTaskToBack(true)
                              }
                          }
                      }
                  })
              }

              private fun requestAllPermissions() {
                  try {
                      val perms = mutableListOf(
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION,
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      )
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      val missing = perms.filter {
                          ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                      }
                      if (missing.isNotEmpty()) {
                          ActivityCompat.requestPermissions(this, missing.toTypedArray(), 1001)
                      }
                  } catch (e: Exception) {}
              }
          }
          EOF

      - name: 5. Build Debug APK with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - run: |
          cd android_build
          gradle assembleDebug --no-daemon

      - name: 6. Upload Ready-to-Install DeenTimeR APK
        uses: actions/upload-artifact@v4
        with:
          name: DeenTimeR-APK
          path: android_build/app/build/outputs/apk/debug/app-debug.apk
