name: Build DeenTimeR Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install SVG Renderer & Accept Android SDK Licenses
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Assemble Native Android Project, Icon & index.html
        run: |
          python3 - << 'PYEOF'
          import os, shutil, subprocess, textwrap

          base = "android_build"
          dirs = [
              f"{base}/app/src/main/assets",
              f"{base}/app/src/main/java/com/example/deentimer",
              f"{base}/app/src/main/res/layout",
              f"{base}/app/src/main/res/drawable",
              f"{base}/app/src/main/res/mipmap-anydpi-v26",
              f"{base}/app/src/main/res/mipmap-mdpi",
              f"{base}/app/src/main/res/mipmap-hdpi",
              f"{base}/app/src/main/res/mipmap-xhdpi",
              f"{base}/app/src/main/res/mipmap-xxhdpi",
              f"{base}/app/src/main/res/mipmap-xxxhdpi",
              f"{base}/app/src/main/res/values",
          ]
          for d in dirs:
              os.makedirs(d, exist_ok=True)

          # Copy index.html into Android assets
          if os.path.exists("index.html"):
              shutil.copy("index.html", f"{base}/app/src/main/assets/index.html")
          elif os.path.exists("app/src/main/assets/index.html"):
              shutil.copy("app/src/main/assets/index.html", f"{base}/app/src/main/assets/index.html")
          else:
              raise FileNotFoundError("index.html not found in repository root!")

          def write_file(path, content):
              clean = content.replace("\u00a0", " ")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(clean).strip() + "\n")

          # Clean Pro SVG Icon (Used to generate all Android mipmap PNGs)
          pro_svg = """
              <?xml version="1.0" encoding="UTF-8"?>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
              <defs>
              <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="50%" stop-color="#020617"/>
              <stop offset="100%" stop-color="#01030a"/>
              </linearGradient>
              <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#090d16"/>
              </linearGradient>
              <linearGradient id="blueArc" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="50%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#6366f1"/>
              </linearGradient>
              <linearGradient id="deenArc" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#34d399"/>
              <stop offset="100%" stop-color="#059669"/>
              </linearGradient>
              <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ff7f50"/>
              <stop offset="50%" stop-color="#ff4757"/>
              <stop offset="100%" stop-color="#e11d48"/>
              </linearGradient>
              <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="100%" stop-color="#f59e0b"/>
              </linearGradient>
              </defs>
              <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
              <rect x="240" y="76" width="32" height="32" fill="#475569"/>
              <rect x="212" y="52" width="88" height="30" rx="15" fill="url(#blueArc)"/>
              <rect x="348" y="96" width="24" height="40" rx="8" transform="rotate(45 360 116)" fill="#ff4757"/>
              <circle cx="256" cy="274" r="164" fill="url(#caseGrad)" stroke="#334155" stroke-width="8"/>
              <circle cx="256" cy="274" r="130" fill="none" stroke="#1e293b" stroke-width="30"/>
              <path d="M 256 144 A 130 130 0 1 1 138 328" fill="none" stroke="url(#blueArc)" stroke-width="30" stroke-linecap="round"/>
              <path d="M 256 182 A 92 92 0 1 1 172 312" fill="none" stroke="url(#deenArc)" stroke-width="14" stroke-linecap="round"/>
              <path d="M 256 196 C 256 196 306 238 296 286 C 289 319 259 334 256 334 C 253 334 223 319 216 286 C 206 238 256 196 256 196 Z" fill="url(#flameGrad)"/>
              <path d="M 256 242 C 256 242 278 264 273 290 C 269 306 258 315 256 315 C 254 315 243 306 239 290 C 234 264 256 242 256 242 Z" fill="url(#coreGrad)"/>
              <line x1="256" y1="274" x2="314" y2="216" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
              <circle cx="256" cy="274" r="18" fill="#ffffff"/>
              <circle cx="256" cy="274" r="8" fill="#ff4757"/>
              </svg>
          """
          svg_path = f"{base}/clean_icon.svg"
          write_file(svg_path, pro_svg)

          # Render PNG icons for all Android screen densities
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in densities.items():
              out_main = f"{base}/app/src/main/res/{folder}/ic_launcher.png"
              out_round = f"{base}/app/src/main/res/{folder}/ic_launcher_round.png"
              subprocess.run(["rsvg-convert", "-w", str(size), "-h", str(size), svg_path, "-o", out_main], check=True)
              shutil.copy(out_main, out_round)

          # 1. settings.gradle
          write_file(f"{base}/settings.gradle", """
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "DeenTimeR"
              include ':app'
          """)

          # 2. gradle.properties
          write_file(f"{base}/gradle.properties", """
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
          """)

          # 3. Root build.gradle
          write_file(f"{base}/build.gradle", """
              plugins {
                  id 'com.android.application' version '8.2.2' apply false
                  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              }
          """)

          # 4. App build.gradle
          write_file(f"{base}/app/build.gradle", """
              plugins {
                  id 'com.android.application'
                  id 'org.jetbrains.kotlin.android'
              }

              android {
                  namespace 'com.example.deentimer'
                  compileSdk 34

                  defaultConfig {
                      applicationId "com.example.deentimer"
                      minSdk 24
                      targetSdk 34
                      versionCode 1
                      versionName "1.0"
                  }

                  buildTypes {
                      release {
                          minifyEnabled false
                      }
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = '17'
                  }
              }

              dependencies {
                  implementation 'androidx.core:core-ktx:1.12.0'
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'androidx.activity:activity-ktx:1.8.2'
              }
          """)

          # 5. AndroidManifest.xml
          write_file(f"{base}/app/src/main/AndroidManifest.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                  xmlns:tools="http://schemas.android.com/tools">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.CAMERA" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                  <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                  <uses-permission android:name="android.permission.WAKE_LOCK" />
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

                  <uses-feature android:name="android.hardware.camera" android:required="false" />
                  <uses-feature android:name="android.hardware.location.gps" android:required="false" />
                  <uses-feature android:name="android.hardware.microphone" android:required="false" />

                  <application
                      android:allowBackup="true"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:label="DeenTimeR"
                      android:supportsRtl="true"
                      android:usesCleartextTraffic="true"
                      android:hardwareAccelerated="true"
                      android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                          android:exported="true"
                          android:keepScreenOn="true"
                          android:launchMode="singleTask">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          """)

          # 6. activity_main.xml
          write_file(f"{base}/app/src/main/res/layout/activity_main.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:id="@+id/main"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#020617"
                  android:keepScreenOn="true">
                  <WebView
                      android:id="@+id/webview"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="#020617"
                      android:keepScreenOn="true" />
              </FrameLayout>
          """)

          # 7. Full Multi-Gradient Adaptive Icon XMLs (Matches SVG 100%)
          write_file(f"{base}/app/src/main/res/drawable/ic_launcher_background.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  xmlns:aapt="http://schemas.android.com/aapt"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path android:pathData="M0,0h108v108h-108z">
                      <aapt:attr name="android:fillColor">
                          <gradient android:startX="0" android:startY="0" android:endX="108" android:endY="108" android:type="linear">
                              <item android:offset="0.0" android:color="#0F172A" />
                              <item android:offset="0.5" android:color="#020617" />
                              <item android:offset="1.0" android:color="#01030A" />
                          </gradient>
                      </aapt:attr>
                  </path>
              </vector>
          """)

          write_file(f"{base}/app/src/main/res/drawable/ic_launcher_foreground.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  xmlns:aapt="http://schemas.android.com/aapt"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path android:fillColor="#475569" android:pathData="M51,21h6v6h-6z" />
                  <path android:pathData="M46,17.5C46,16.12 47.12,15 48.5,15h11C60.88,15 62,16.12 62,17.5v1C62,19.88 60.88,21 59.5,21h-11C47.12,21 46,19.88 46,18.5v-1z">
                      <aapt:attr name="android:fillColor">
                          <gradient android:startX="46" android:startY="15" android:endX="62" android:endY="21" android:type="linear">
                              <item android:offset="0.0" android:color="#38BDF8" />
                              <item android:offset="1.0" android:color="#6366F1" />
                          </gradient>
                      </aapt:attr>
                  </path>
                  <path android:fillColor="#FF4757" android:pathData="M71.5,25.5l4.2,-4.2l3.2,3.2l-4.2,4.2z" />
                  <path android:pathData="M54,57m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0" android:strokeWidth="1.5" android:strokeColor="#334155">
                      <aapt:attr name="android:fillColor">
                          <gradient android:startX="26" android:startY="29" android:endX="82" android:endY="85" android:type="linear">
                              <item android:offset="0.0" android:color="#1E293B" />
                              <item android:offset="1.0" android:color="#090D16" />
                          </gradient>
                      </aapt:attr>
                  </path>
                  <path android:fillColor="#00000000" android:strokeWidth="5.2" android:strokeColor="#1E293B" android:pathData="M54,57m-22.5,0a22.5,22.5 0,1 1,45 0a22.5,22.5 0,1 1,-45 0" />
                  <path android:fillColor="#00000000" android:strokeWidth="5.2" android:strokeLineCap="round" android:pathData="M54,34.5 A22.5,22.5 0 1,1 33.2,65.6">
                      <aapt:attr name="android:strokeColor">
                          <gradient android:startX="54" android:startY="34" android:endX="33" android:endY="78" android:type="linear">
                              <item android:offset="0.0" android:color="#38BDF8" />
                              <item android:offset="0.5" android:color="#3B82F6" />
                              <item android:offset="1.0" android:color="#6366F1" />
                          </gradient>
                      </aapt:attr>
                  </path>
                  <path android:fillColor="#00000000" android:strokeWidth="2.4" android:strokeLineCap="round" android:pathData="M54,41 A16,16 0 1,1 39.2,63.2">
                      <aapt:attr name="android:strokeColor">
                          <gradient android:startX="54" android:startY="41" android:endX="39" android:endY="73" android:type="linear">
                              <item android:offset="0.0" android:color="#34D399" />
                              <item android:offset="1.0" android:color="#059669" />
                          </gradient>
                      </aapt:attr>
                  </path>
                  <path android:pathData="M54,43 C54,43 62.5,50.2 60.8,58.5 C59.6,64.2 54.5,66.8 54,66.8 C53.5,66.8 48.4,64.2 47.2,58.5 C45.5,50.2 54,43 54,43 Z">
                      <aapt:attr name="android:fillColor">
                          <gradient android:startX="54" android:startY="43" android:endX="54" android:endY="67" android:type="linear">
                              <item android:offset="0.0" android:color="#FF7F50" />
                              <item android:offset="0.5" android:color="#FF4757" />
                              <item android:offset="1.0" android:color="#E11D48" />
                          </gradient>
                      </aapt:attr>
                  </path>
                  <path android:pathData="M54,51 C54,51 57.8,54.8 57,59.2 C56.4,62 54.3,63.5 54,63.5 C53.7,63.5 51.6,62 51,59.2 C50.2,54.8 54,51 54,51 Z">
                      <aapt:attr name="android:fillColor">
                          <gradient android:startX="54" android:startY="51" android:endX="54" android:endY="63.5" android:type="linear">
                              <item android:offset="0.0" android:color="#FEF08A" />
                              <item android:offset="1.0" android:color="#F59E0B" />
                          </gradient>
                      </aapt:attr>
                  </path>
                  <path android:fillColor="#00000000" android:strokeWidth="2.8" android:strokeColor="#FFFFFF" android:strokeLineCap="round" android:pathData="M54,57 L63.5,47.5" />
                  <path android:fillColor="#FFFFFF" android:pathData="M54,57m-3.2,0a3.2,3.2 0,1 1,6.4 0a3.2,3.2 0,1 1,-6.4 0" />
                  <path android:fillColor="#FF4757" android:pathData="M54,57m-1.4,0a1.4,1.4 0,1 1,2.8 0a1.4,1.4 0,1 1,-2.8 0" />
              </vector>
          """)

          adaptive_xml = """
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background"/>
                  <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              </adaptive-icon>
          """
          write_file(f"{base}/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", adaptive_xml)
          write_file(f"{base}/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", adaptive_xml)

          # 8. MainActivity.kt
          write_file(f"{base}/app/src/main/java/com/example/deentimer/MainActivity.kt", """
              package com.example.deentimer

              import android.Manifest
              import android.annotation.SuppressLint
              import android.content.pm.PackageManager
              import android.graphics.Color
              import android.os.Build
              import android.os.Bundle
              import android.view.WindowManager
              import android.webkit.CookieManager
              import android.webkit.GeolocationPermissions
              import android.webkit.JavascriptInterface
              import android.webkit.PermissionRequest
              import android.webkit.WebChromeClient
              import android.webkit.WebSettings
              import android.webkit.WebView
              import android.webkit.WebViewClient
              import androidx.activity.OnBackPressedCallback
              import androidx.appcompat.app.AppCompatActivity
              import androidx.core.app.ActivityCompat
              import androidx.core.content.ContextCompat
              import androidx.core.view.WindowCompat

              class MainActivity : AppCompatActivity() {
                  private lateinit var webView: WebView

                  @SuppressLint("SetJavaScriptEnabled")
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      window.statusBarColor = Color.parseColor("#020617")
                      window.navigationBarColor = Color.parseColor("#020617")

                      WindowCompat.getInsetsController(window, window.decorView).apply {
                          isAppearanceLightStatusBars = false
                          isAppearanceLightNavigationBars = false
                      }

                      setContentView(R.layout.activity_main)
                      webView = findViewById(R.id.webview)
                      webView.keepScreenOn = true

                      requestAllPermissions()

                      CookieManager.getInstance().setAcceptCookie(true)
                      CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)

                      webView.settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          setGeolocationEnabled(true)
                          allowFileAccess = true
                          allowContentAccess = true
                          allowFileAccessFromFileURLs = true
                          allowUniversalAccessFromFileURLs = true
                          javaScriptCanOpenWindowsAutomatically = true
                          mediaPlaybackRequiresUserGesture = false
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                          cacheMode = WebSettings.LOAD_DEFAULT
                      }

                      webView.webViewClient = WebViewClient()
                      webView.webChromeClient = object : WebChromeClient() {
                          override fun onGeolocationPermissionsShowPrompt(origin: String?, callback: GeolocationPermissions.Callback?) {
                              callback?.invoke(origin, true, false)
                          }
                          override fun onPermissionRequest(request: PermissionRequest?) {
                              request?.let { runOnUiThread { it.grant(it.resources) } }
                          }
                      }

                      webView.addJavascriptInterface(object {
                          @JavascriptInterface
                          fun setKeepScreenOn(enable: Boolean) {
                              runOnUiThread {
                                  if (enable) {
                                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                      webView.keepScreenOn = true
                                  } else {
                                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                      webView.keepScreenOn = false
                                  }
                              }
                          }
                      }, "AndroidBridge")

                      val htmlContent = assets.open("index.html").bufferedReader().use { it.readText() }
                      webView.loadDataWithBaseURL(
                          "https://neettimercloud.firebaseapp.com/",
                          htmlContent,
                          "text/html",
                          "UTF-8",
                          null
                      )

                      onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              webView.evaluateJavascript("window.handleAndroidBack && window.handleAndroidBack()") { result ->
                                  if (result != "true") {
                                      moveTaskToBack(true)
                                  }
                              }
                          }
                      })
                  }

                  private fun requestAllPermissions() {
                      try {
                          val perms = mutableListOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION,
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          )
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              perms.add(Manifest.permission.POST_NOTIFICATIONS)
                          }
                          val missing = perms.filter {
                              ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                          }
                          if (missing.isNotEmpty()) {
                              ActivityCompat.requestPermissions(this, missing.toTypedArray(), 1001)
                          }
                      } catch (e: Exception) {}
                  }
              }
          """)
          print("Android project and multi-density icons assembled successfully!")
          PYEOF

      - name: 5. Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 6. Build Debug APK with Gradle
        run: |
          cd android_build
          gradle assembleDebug --no-daemon

      - name: 7. Upload Ready-to-Install DeenTimeR APK
        uses: actions/upload-artifact@v4
        with:
          name: DeenTimeR-APK
          path: android_build/app/build/outputs/apk/debug/app-debug.apk
